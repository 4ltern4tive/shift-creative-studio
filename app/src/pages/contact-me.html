<section class="contact-hero">
  <div class="contact-hero__bg" aria-hidden="true">
    <img src="/assets/img/gnhOdi9FsyMmWmZMArufNrjbI.png" alt="">
  </div>
  <h1 class="contact-hero__title t-display-xl reveal" style="margin-top:120px;"><span class="reveal__cover" aria-hidden="true"></span>Contact me</h1>
  <div class="contact-hero__content">
    <div class="contact-hero__left">
      <a class="contact-hero__mail" href="mailto:hello@shiftstudio.design">hello@shiftstudio.design</a>
      <a class="contact-hero__mail" href="mailto:hello@shiftstudio.design">@shiftstudio.design</a>
      <div class="follow">
        <p class="t-mono c-55">(Follow me)</p>
        <div class="follow__socials">
          <a class="follow__icon" href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.2 8h4.6v14.8H.2V8zm7.6 0h4.4v2h.1c.6-1.1 2.1-2.3 4.3-2.3 4.6 0 5.4 3 5.4 6.9v8.2h-4.6v-7.3c0-1.7 0-4-2.4-4s-2.8 1.9-2.8 3.9v7.4H7.8V8z"/></svg>
          </a>
          <a class="follow__icon" href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.4"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>
          </a>
        </div>
      </div>
    </div>
    <div class="contact-hero__right">
      <form class="form" novalidate>
        <div class="form__row">
          <div class="form__field">
            <label for="f-name">Name</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="form__field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>
        <div class="form__field">
          <label for="f-budget">Project budget</label>
          <select id="f-budget" name="budget" required>
            <option value="" selected>Select…</option>
            <option>1000-3000$</option>
            <option>3000-5000$</option>
            <option>&gt;5000$</option>
          </select>
        </div>
        <div class="form__field">
          <label for="f-msg">Your message</label>
          <textarea id="f-msg" name="message" required></textarea>
        </div>
        <button class="form__submit" type="submit">Submit</button>
        <p class="form__ok" aria-live="polite"></p>
      </form>
      <div class="follow">
        <p class="t-mono c-55">(Follow me)</p>
        <div class="follow__socials">
          <a class="follow__icon" href="https://www.linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.2 8h4.6v14.8H.2V8zm7.6 0h4.4v2h.1c.6-1.1 2.1-2.3 4.3-2.3 4.6 0 5.4 3 5.4 6.9v8.2h-4.6v-7.3c0-1.7 0-4-2.4-4s-2.8 1.9-2.8 3.9v7.4H7.8V8z"/></svg>
          </a>
          <a class="follow__icon" href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.4"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
